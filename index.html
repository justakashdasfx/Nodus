<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Nodus</title>

  <!-- Apply saved theme / font / sidebar state before first paint (no flash). -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        root.dataset.theme = localStorage.getItem('notes.theme') || 'dark';
        if (localStorage.getItem('notes.sidebar') === 'closed') root.classList.add('sidebar-collapsed');
        if (localStorage.getItem('notes.topbar') === 'hidden') root.classList.add('topbar-hidden');
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc && root.dataset.theme === 'light') tc.setAttribute('content', '#efefed');
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>

  <!-- Installable app + icons (placeholder artwork in /icons — replace the files, keep the names). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Styles — order matters: tokens first, components before views. -->
  <link rel="stylesheet" href="css/fonts.css">   <!-- Geist, bundled so it works offline -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/tasks-tags.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="card" id="card">
        <div class="card__scroll" id="view"></div>
        <!-- Side pane: hidden until a note or tag list is opened beside the page (js/ui/pane.js) -->
        <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"
             aria-label="Resize side panel (double-click to reset)" title="Drag to resize · double-click to reset" hidden></div>
        <aside class="pane" id="pane" aria-label="Side panel" hidden></aside>
      </main>
    </div>
  </div>

  <div class="scrim" data-action="sidebar-toggle"></div> <!-- mobile only -->
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
